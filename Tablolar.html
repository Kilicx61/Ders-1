<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablolar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6ebd0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            
        }
        table {
            border-collapse: collapse;
            width: 60%;
            background-color: #f7f7f7;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #000;
            padding: 12px;
            text-align: left;
        }
        th {
            border-radius: 8px;
            background-color: #757ede;
        }
    </style>
</head>
<body>
    <table border="1" border-radius="8px" cellpadding="10" cellspacing="0" style="border-collapse: collapse; width: 60%; background-color: #f7f7f7; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
        <tr>
            <th>Ad</th>
            <th>Soyad</th>
            <th>Yaş</th>
        </tr>
        <tr>
            <td>Ahmet</td>
            <td>Yılmaz</td>
            <td>25</td>
        </tr>
        <tr>
            <td>Ayşe</td>
            <td>Kara</td>
            <td>30</td>
        </tr>
        <tr>
            <td>Mehmet</td>
            <td>Demir</td>
            <td>28</td>
        </tr>
        <tr>
            <td>Elif</td>
            <td>Çelik</td>
            <td>22</td>
        </tr>
    </table>
</body>
</html>
